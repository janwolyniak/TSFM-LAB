schema_version: 1
name: usage-weather-demo
workflow:
  schema_version: 1
  profile: weather
  options:
    variable: wind_speed
    station: synthetic-station
    measurement_semantics: instantaneous
model:
  source: builtin
  adapter_id: last_value
dataset:
  path: ../datasets/weather-demo.csv
  timestamp_column: timestamp
  target_column: wind_speed
  frequency: 1h
  units: m/s
evaluation:
  context_length: 48
  horizon: 4
  stride: 4
  evaluation_start: '2026-01-03T00:00:00Z'
  evaluation_end: '2026-01-03T16:00:00Z'
  seasonal_period: 24
  metrics:
  - mae
  - rmse
  - mase
output:
  directory: ../../results
