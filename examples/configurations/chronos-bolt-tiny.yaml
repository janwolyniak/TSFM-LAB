schema_version: 1
name: seasonal-demo-chronos-bolt-tiny
model:
  source: huggingface
  adapter_id: chronos_bolt
  repository: amazon/chronos-bolt-tiny
  revision: a0e552de83495b5c28c14c71c374f3e33280b340
  offline: true
  cache_dir: ../../model-cache
dataset:
  path: ../datasets/seasonal.csv
  timestamp_column: timestamp
  target_column: demand
  frequency: 1h
  units: synthetic_units
evaluation:
  context_length: 8
  horizon: 4
  stride: 4
  evaluation_start: "2026-01-01T16:00:00Z"
  evaluation_end: "2026-01-02T08:00:00Z"
  seasonal_period: 4
  metrics: [mae, rmse, mase]
runtime:
  device: cpu
  dtype: float32
  batch_size: 1
  seed: 0
output:
  directory: ../../results
