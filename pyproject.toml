[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm-lab"
version = "0.3.0"
description = "Local, domain-independent time-series forecast evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.urls]
Repository = "https://github.com/janwolyniak/TSFM-LAB"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16", "black>=26,<27"]
cli = ["typer>=0.24,<0.25", "rich>=14,<15", "PyYAML>=6,<7", "prompt-toolkit>=3.0.50,<3.1"]
parquet = ["pyarrow>=23,<24"]
hub = ["huggingface-hub==0.35.3"]
tui = ["tsfm-lab[cli]", "textual==8.2.8"]
connections = ["httpx==0.28.1", "PyJWT[crypto]==2.10.1", "keyring>=25.6,<26"]
chronos = [
    "chronos-forecasting==2.2.0",
    "torch>=2.8,<2.9",
    "transformers>=4.56,<4.57",
    "huggingface-hub==0.35.3",
    "safetensors>=0.6,<0.7",
    "accelerate>=1.12,<1.13",
]
timesfm = [
    "timesfm==3.0.2",
    "torch>=2.8,<2.9",
    "huggingface-hub==0.35.3",
    "safetensors>=0.6,<0.7",
]
tirex2 = [
    "tirex-2==0.4.0",
    "torch>=2.8,<2.9",
    "huggingface-hub==0.35.3",
    "safetensors>=0.6,<0.7",
    "numpy>=2.1.3,<3",
    "flashrnn==1.0.8",
    "mlstm-kernels==2.0.6",
    "ninja==1.13.2",
    "narwhals==2.13.0",
    "triton-windows==3.4.0.post21; sys_platform == 'win32'",
]
ttm = [
    "granite-tsfm==0.3.4",
    "torch>=2.8,<2.9",
    "transformers==4.56.0",
    "tokenizers==0.22.0",
    "scikit-learn==1.7.2",
    "filelock==3.20.3",
    "huggingface-hub==0.35.3",
    "safetensors>=0.6,<0.7",
    "accelerate>=1.12,<1.13",
]
toto2 = [
    "toto-2==2.0.0",
    "torch>=2.8,<2.9",
    "huggingface-hub==0.35.3",
    "safetensors>=0.6,<0.7",
    "numpy==2.1.3",
    "gluonts[torch]==0.16.2",
    "dd-unit-scaling==0.1.0",
    "unit-scaling==0.3.5",
    "einops==0.8.2",
    "jaxtyping==0.3.11",
    "lightning==2.4.0",
    "pytorch-lightning==2.4.0",
    "scipy>=1.14,<1.16",
    "matplotlib==3.10.8",
]

[project.scripts]
tsfm = "tsfm_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tsfm_lab.resources" = ["*.csv"]
"tsfm_lab.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"
markers = [
    "chronos_smoke: explicit local checkpoint and installed runtime required; never downloads",
    "chronos2_smoke: explicit local or cached Chronos-2 checkpoint and installed runtime required; never downloads",
    "timesfm_smoke: explicit local TimesFM 2.5 checkpoint and installed runtime required; never downloads",
    "tirex2_smoke: explicit local or cached TiRex-2 checkpoint and installed runtime required; never downloads",
    "ttm_smoke: explicit local or cached TTM checkpoint and installed runtime required; never downloads",
]

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
