[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm-lab"
version = "0.1.0"
description = "Local, domain-independent time-series forecast evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16", "black>=26,<27"]
cli = ["typer>=0.24,<0.25", "rich>=14,<15", "PyYAML>=6,<7"]
parquet = ["pyarrow>=23,<24"]

[project.scripts]
tsfm = "tsfm_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
