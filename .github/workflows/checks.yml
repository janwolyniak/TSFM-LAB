name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONUTF8: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-dev.txt setuptools
      - run: python -m pip install --no-build-isolation -c requirements-dev.txt -c requirements-tui.txt -e '.[dev,cli,parquet,tui,connections]'
      - run: python -m black --check src tests examples scripts
      - run: python -m ruff check src tests examples scripts
      - run: python -m pytest --junitxml=test-results.xml -o faulthandler_timeout=90
      - name: Build and verify a clean installed wheel with native paths
        run: python scripts/check_installed_distribution.py > installed-workflow.log
      - run: python examples/baseline.py
      - run: tsfm --help
      - run: tsfm run examples/configurations/last-value.yaml --json
      - run: tsfm experiments list --workspace results --json
      - name: Retain qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            installed-workflow.log
            ${{ runner.temp }}/tsfm-ci-*/qualification/distributions.json
            ${{ runner.temp }}/tsfm-ci-*/qualification/verification.json
          if-no-files-found: warn
          retention-days: 14
