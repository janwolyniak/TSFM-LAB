name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-dev.txt -c requirements-tui.txt -e '.[dev,cli,parquet,tui]'
      - run: python -m black --check src tests examples
      - run: python -m ruff check src tests examples
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest
      - run: python -m pip wheel --no-deps --no-build-isolation --no-index --wheel-dir /tmp/tsfm-wheels .
      - run: python examples/baseline.py
      - run: tsfm --help
      - run: tsfm run examples/configurations/last-value.yaml --json
      - run: tsfm experiments list --workspace results --json
