name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-dev.txt setuptools
      - run: python -m pip install --no-build-isolation -c requirements-dev.txt -c requirements-tui.txt -e '.[dev,cli,parquet,tui,connections]'
      - run: python -m black --check src tests examples scripts
      - run: python -m ruff check src tests examples scripts
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest
      - name: Build source archive and wheel
        run: python scripts/build_distribution.py --out-dir "$RUNNER_TEMP/tsfm-dist" > "$RUNNER_TEMP/tsfm-distributions.json"
      - name: Verify the installed wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/tsfm-install"
          TSFM_WHEEL="$(python -c 'import json, os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "tsfm-distributions.json")))["wheel"]["path"])')"
          "$RUNNER_TEMP/tsfm-install/bin/python" -m pip install -c requirements-dev.txt "${TSFM_WHEEL}[cli,parquet]"
          "$RUNNER_TEMP/tsfm-install/bin/python" -m pip check
          PATH="$RUNNER_TEMP/tsfm-install/bin:$PATH" "$RUNNER_TEMP/tsfm-install/bin/python" -I scripts/verify_distribution.py
      - run: python examples/baseline.py
      - run: tsfm --help
      - run: tsfm run examples/configurations/last-value.yaml --json
      - run: tsfm experiments list --workspace results --json
