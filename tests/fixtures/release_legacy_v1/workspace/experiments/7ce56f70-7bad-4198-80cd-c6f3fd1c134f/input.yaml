schema_version: 1
name: Historical last_value
model:
  source: builtin
  adapter_id: last_value
dataset:
  path: ohlc.csv
  timestamp_column: close_timestamp
  target_column: close
  frequency: 1h
  units: synthetic_quote
  series_id: synthetic_asset
evaluation:
  context_length: 2
  horizon: 1
  stride: 1
  evaluation_start: '2026-01-01T02:00:00+00:00'
  evaluation_end: '2026-01-01T08:00:00+00:00'
  seasonal_period: 2
output:
  directory: workspace
